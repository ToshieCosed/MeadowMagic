# Builds the Android APK and publishes a GitHub Release on every push to main or mineCompatibility.
name: Android

on:
  push:
    branches: [main, mineCompatibility]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Build standalone page
        run: python3 tools/build_standalone.py

      - name: Relay tests (Node and Java parity)
        run: |
          cd tools/relay && npm install --no-audit --no-fund
          node test-auth.mjs && node test-mc.mjs
          mkdir -p /tmp/relay-out && javac -d /tmp/relay-out ../../android/app/src/main/java/app/strata/relay/*.java
          RELAY_CMD="java -cp /tmp/relay-out app.strata.relay.RelayMain" node test-auth.mjs
          RELAY_CMD="java -cp /tmp/relay-out app.strata.relay.RelayMain" node test-mc.mjs

      - name: Android SDK packages (runner already has the SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ github.ref_name }}-${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk strata-android.apk
          PRE=""; [ "${{ github.ref_name }}" = "main" ] || PRE="--prerelease"
          gh release create "$TAG" strata-android.apk release/strata-standalone.html $PRE \
            --target "$GITHUB_SHA" --title "Strata Android ${GITHUB_RUN_NUMBER} (${{ github.ref_name }})" \
            --notes "$(git log -1 --pretty=%B)

          Install **strata-android.apk** (allow installs from this source). The Minecraft sign-in needs your own Azure client id: see tools/relay/README.md."
